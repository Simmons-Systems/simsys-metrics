name: Node CI

on:
  push:
    branches: [main]
    paths:
      - "node/**"
      - ".github/workflows/test-node.yml"
  pull_request:
    paths:
      - "node/**"
      - ".github/workflows/test-node.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      fail-fast: false
      # Library's "engines" claim is node>=20. The matrix's Node 20 lane
      # runs the FULL suite on the floor, so no separate engines-floor
      # job is needed (the old build-node18 job existed only because
      # vitest@4 couldn't run on Node 18).
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run vitest
        run: npm test

      - name: Pack tarball (smoke test)
        run: npm pack --dry-run

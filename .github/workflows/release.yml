name: Release

# Per-language release lanes, routed by tag prefix. The repo migrated
# from unified `v*` tags to `python-v*` / `node-v*` / `go/v*` on
# 2026-04-29 (see README "Tag prefix" table); the old `v*` trigger
# never matched the new prefixes, so tag pushes silently skipped the
# release job (Redmine #47681).
#
# workflow_dispatch is the retro-run lane: dispatch at a tag ref
# (e.g. `gh workflow run release.yml --ref python-v0.3.11`) to build
# artifacts for a tag pushed before this fix. Jobs gate on the ref
# name prefix, so dispatching from a branch ref runs nothing.

on:
  push:
    tags:
      - "python-v*"
      - "node-v*"
      - "go/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-release:
    name: "Python: build wheel + sdist, attest, release"
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel and sdist
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*"

      # Sanity-check the artifacts BEFORE anything irreversible. A PyPI
      # version number can never be reused, so a malformed sdist discovered
      # after upload costs a version rather than a retry.
      - name: Validate distributions
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m twine check --strict dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        # Trusted Publishing (OIDC) -- no long-lived token in secrets. The
        # id-token: write permission this job already declares is what
        # authenticates; PyPI must have a matching publisher configured for
        # this repo + workflow filename + environment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2


  node-release:
    name: "Node: pack tarball, attest, release"
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node/package-lock.json
          # REQUIRED for `npm publish` to authenticate. Setting NODE_AUTH_TOKEN
          # alone does nothing: npm reads its credential from an .npmrc, and
          # this input is what makes setup-node WRITE that .npmrc with an
          # ${NODE_AUTH_TOKEN} placeholder. Without it the env var is simply
          # ignored and publish fails ENEEDAUTH -- which is indistinguishable
          # from a missing or invalid token, and sent us looking at the
          # credential instead of the workflow.
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (locked)
        run: npm ci

      - name: Build (ESM + CJS)
        run: npm run build

      - name: Run vitest
        run: npm test

      # Pack into runner.temp so the glob below can never pick up a
      # stray in-tree tarball. npm names scoped packages
      # `simsys-metrics-<version>.tgz` — the README install URL shape.
      - name: Pack release tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "${{ runner.temp }}/simsys-metrics-*.tgz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/simsys-metrics-*.tgz

      # --provenance is the natural continuation of the attestation above:
      # npm records the same build-provenance link on the registry entry.
      # Requires id-token: write, which this job already declares.
      #
      # Ordered AFTER the GitHub release deliberately. Existing consumers pin
      # the .tgz asset URL directly, so registry publication must be purely
      # additive -- if npm is down or the token lapses, the tarball those
      # consumers depend on must still ship. Publishing first made the release
      # hostage to the registry, which is backwards.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go-release:
    # Go consumers fetch the module by tag via the module proxy — no
    # build artifacts to attach. This lane just publishes the GitHub
    # release with generated notes for parity with the other lanes.
    name: "Go: create release (module fetched by tag)"
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

  # ── Post-publish verification (Redmine #50481) ──────────────────────────
  #
  # These jobs CONSUME each published artifact from its public registry. They
  # exist because every other check in this repo resolves the artifact by
  # directory: `go/v2.0.0` passed go build, go vet, go test -race, staticcheck,
  # the conformance suite and all 18 PR contexts while being unfetchable, and
  # the first thing that noticed was a human installing it by hand afterwards.
  #
  # Publication is irreversible, so these REPORT rather than prevent — a
  # failure turns the release run red, which is the alarm. The value is
  # turning "found weeks later by a consumer" into "found in a minute", which
  # is the margin that kept go/v2.0.0 a dangling tag rather than a checksum
  # mismatch in somebody's build.
  #
  # Version comes from $GITHUB_REF_NAME (a built-in env var), never from a
  # ${{ }} interpolation inside run: — untrusted input does not belong in a
  # shell command line.

  python-verify:
    name: "Python: verify the published release installs from PyPI"
    needs: python-release
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job needs no credentials — it only reads bin/ and talks to PyPI.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Consume simsys-metrics from PyPI
        run: bin/verify-published.sh python "${GITHUB_REF_NAME#python-v}"

  node-verify:
    name: "Node: verify the published release installs from npm"
    needs: node-release
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Consume @simsys/metrics from registry.npmjs.org
        run: bin/verify-published.sh node "${GITHUB_REF_NAME#node-v}"

  go-verify:
    name: "Go: verify the published module resolves via proxy.golang.org"
    needs: go-release
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Explicit pin, matching the go-ci.yml test matrix floor. The module
          # under test declares go 1.25.0, so anything older cannot build it.
          go-version: "1.25.x"

      - name: Consume the module from proxy.golang.org
        # The script builds a throwaway module OUTSIDE this repo with GOWORK=off
        # deliberately: resolving inside the repo succeeds by directory
        # resolution and would not have caught the v2.0.0 module-path defect.
        run: bin/verify-published.sh go "${GITHUB_REF_NAME#go/}"

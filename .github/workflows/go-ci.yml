name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "spec/**"          # contract edits must exercise this lane
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - "spec/**"          # contract edits must exercise this lane
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # go.mod declares `go 1.25` — pinned by github.com/prometheus/procfs
      # v0.20+. Test on the floor + the latest minor.
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go test (race detector + coverage)
        working-directory: go
        # Exclude examples/ — they're package main demos; combining them with
        # -coverprofile=./... triggers `go: no such tool "covdata"` failure.
        run: |
          PKGS=$(go list ./... | grep -v /examples/ | tr '\n' ' ')
          go test -race -coverprofile=coverage.out $PKGS

      - name: Coverage summary
        working-directory: go
        run: go tool cover -func=coverage.out | tail -20

      - name: Fuzz smoke (5s per target, latest Go lane only)
        if: matrix.go-version == '1.26.x'
        working-directory: go
        run: |
          for target in FuzzStatusBucket FuzzNormalizeMethod FuzzSafeLabel FuzzIPToSubnet24; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=5s .
          done

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go version here is bounded on BOTH sides, so it must be an
          # explicit pin — do not switch this to `go-version-file: go/go.mod`.
          #
          # The staticcheck step below runs with `install-go: false` and
          # GOTOOLCHAIN=local, so the staticcheck binary is BUILT and RUN with
          # exactly the toolchain this step installs. That creates two bounds:
          #
          #   lower — staticcheck's own go.mod sets a minimum. 2026.2 declares
          #           `go 1.26.0`, so a 1.25 toolchain cannot even build it:
          #           "requires go >= 1.26.0 (running go 1.25.0; GOTOOLCHAIN=local)".
          #   upper — a staticcheck release can only decode export data from the
          #           toolchains it shipped with, so a toolchain NEWER than the
          #           `version:` pin below fails every stdlib import with
          #           "export data version N is greater than maximum supported version M".
          #
          # Deriving this from go/go.mod (currently `go 1.25.0`) violates the
          # lower bound and was tried — it fails. The module floor and the
          # linter toolchain are genuinely different things.
          #
          # This pin must therefore move together with the `version:` pin below,
          # by hand. Renovate floated it twice before (33db5b2, f7f90cd), each
          # time rewriting a deliberate pin and leaving the comment describing
          # the opposite of the config; renovate.json now carries a packageRules
          # entry disabling `go` updates for this file to prevent a third.
          go-version: "1.27.x"
          cache-dependency-path: go/go.sum

      - name: staticcheck
        # SHA-pinned action (Scorecard Pinned-Dependencies) maintained by
        # staticcheck's author — replaces the unhashed `go install ...@2026.1`.
        #
        # `install-go: false` means this uses the go/go.mod floor toolchain
        # installed by the step above; the two are coupled deliberately.
        #
        # Renovate does NOT manage this `version:` input: only
        # actions/setup-{go,node,python} inputs and a fixed community-action
        # registry are extracted, and dominikh/staticcheck-action is in
        # neither. Renovate bumps the action's own SHA/tag (v1.4.1), never the
        # staticcheck release below. So this pin moves by hand — raise it in
        # the same change that raises the `go` directive in go/go.mod.
          # 2026.2 is the first staticcheck release with Go 1.27 support.
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.2"
          install-go: false
          working-directory: go

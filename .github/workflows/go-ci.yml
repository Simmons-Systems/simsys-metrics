name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # go.mod declares `go 1.25` — pinned by github.com/prometheus/procfs
      # v0.20+. Test on the floor + the latest minor.
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go test (race detector + coverage)
        working-directory: go
        # Exclude examples/ — they're package main demos; combining them with
        # -coverprofile=./... triggers `go: no such tool "covdata"` failure.
        run: |
          PKGS=$(go list ./... | grep -v /examples/ | tr '\n' ' ')
          go test -race -coverprofile=coverage.out $PKGS

      - name: Coverage summary
        working-directory: go
        run: go tool cover -func=coverage.out | tail -20

      - name: Fuzz smoke (5s per target, latest Go lane only)
        if: matrix.go-version == '1.26.x'
        working-directory: go
        run: |
          for target in FuzzStatusBucket FuzzNormalizeMethod FuzzSafeLabel FuzzIPToSubnet24; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=5s .
          done

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # KEEP IN SYNC with the staticcheck `version:` below. The action
          # runs `go install honnef.co/go/tools/cmd/staticcheck@<version>`
          # against THIS toolchain, so a staticcheck release older than the
          # Go minor here fails to decode stdlib export data:
          #   "export data version N is greater than maximum supported version M".
          # A staticcheck release only supports Go minors up to its own
          # release date, so this must never lead staticcheck's support.
          go-version: "1.27.x"
          cache-dependency-path: go/go.sum

      - name: staticcheck
        # SHA-pinned action (Scorecard Pinned-Dependencies) maintained by
        # staticcheck's author — replaces the unhashed `go install ...@2026.1`.
        # install-go: false → builds+runs staticcheck with the setup-go
        # toolchain above, hence the sync requirement noted there.
        # 2026.2 is the first release with Go 1.27 support.
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.2"
          install-go: false
          working-directory: go

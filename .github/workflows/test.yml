name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      # Deps come from a uv-compiled, hash-pinned lockfile (Scorecard
      # Pinned-Dependencies). The editable self-install is dep-free.
      - name: Install package with test extras
        run: |
          pip install --require-hashes -r .github/requirements/ci.txt
          pip install --no-deps -e .

      - name: Run pytest with coverage
        run: pytest -ra -v --cov=simsys_metrics --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # The Python lane never built a distributable, so a broken pyproject, a
      # missing package-data entry, or an sdist omitting a module would pass
      # every required check and fail during the RELEASE -- after the tag is
      # pushed, and now after a PyPI version number is irreversibly spent.
      # Same class as a CI that only ever compiles and never packages.
      - name: Build and validate distributions
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build
          python -m twine check --strict dist/*

      - name: Run conformance smoke test
        run: bin/check-metrics-conformance.sh

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check simsys_metrics tests

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
